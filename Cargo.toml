[package]
name = "mdbook-classy"
version = "0.5.0"

authors = ["Doug Bradshaw <dhbradshaw@gmail.com>", "ucw <wuxianucw@outlook.com>"]
categories = ["command-line-utilities"]
description = "An mdbook preprocessor for adding html-css classes to markdown."
edition = "2021"
exclude = [
    "examples/*",
    "Makefile",
]
homepage = "https://github.com/wuxianucw/mdbook-classy"
keywords = ["mdbook", "classy", "markdown", "commonmark","css"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/wuxianucw/mdbook-classy"

[dependencies]
clap = { version = "4.1.14", features = ["cargo"] }
#mdbook = ">=0.4.0, <=0.4.36" # mdbook requires pulldown-cmark 0.10 since 0.4.37
mdbook-core = "0.5.4"
mdbook-markdown = "0.5.4"
mdbook-preprocessor = "0.5.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
pulldown-cmark-to-cmark = "22.0.1" # pulldown-cmark-to-cmark requires pulldown-cmark 0.9
serde_json = "1.0.96"
